services:
  app:
    build:
      context: .
      args:
        IMAGE: ghcr.io/nationalarchives/tna-python-dev
        IMAGE_TAG: preview
    depends_on:
      - db
      - s3
      - redis
    ports:
      - 8000:8080
    environment:
      - ENVIRONMENT_NAME=local
      - DJANGO_SETTINGS_MODULE=config.settings.develop
      - SECRET_KEY=abc123
      - ALLOWED_HOSTS=localhost,host.docker.internal,wagtail.localhost
      - DEBUG=True
      - DATABASE_HOST=db
      - DATABASE_NAME=postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - WAGTAILAPI_AUTHENTICATION
      - DJANGO_SUPERUSER_PASSWORD=admin
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@tna.dev
      - WAGTAILADMIN_BASE_URL=http://localhost:8000
      - WAGTAILAPI_BASE_URL=http://host.docker.internal:8000
      - MEDIA_PAGE_URL=https://localhost
      - REDIS_URL=redis://redis:6379/0
      - ROSETTA_API_URL=https://rosetta-dev.k-int.com/rosetta/data
      - WAGTAIL_2FA_REQUIRED=False
      - EMAIL_HOST
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - NEW_LABEL_DISPLAY_FOR_DAYS=21
      - AWS_STORAGE_BUCKET_NAME=wagtail
      - AWS_S3_ENDPOINT_URL=http://s3:9000
      - AWS_S3_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID}
      - AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY}
      - AWS_S3_CUSTOM_DOMAIN=localhost/media
    volumes:
      - ./:/app
    healthcheck:
      start_period: 10s
      start_interval: 2s

  db:
    image: postgres:15.18
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:latest

  s3:
    image: scireum/s3-ninja
    ports:
      - 8002:9000
    volumes:
      - s3data:/home/sirius/data
      - ./.env:/home/sirius/.env
    entrypoint:
      [
        "sh",
        "-c",
        'AWS_S3_ACCESS_KEY_ID=$(grep -Eo ''awsAccessKey = "(.*)"'' /home/sirius/app/application.conf | grep -Eo ''"(.*)"'' | tr -d ''"'') && AWS_S3_SECRET_ACCESS_KEY=$(grep -Eo ''awsSecretKey = "(.*)"'' /home/sirius/app/application.conf | grep -Eo ''"(.*)"'' | tr -d ''"'') && export AWS_S3_ACCESS_KEY_ID AWS_S3_SECRET_ACCESS_KEY && tmp_env=$(mktemp) && awk -v ak="$$AWS_S3_ACCESS_KEY_ID" -v sk="$$AWS_S3_SECRET_ACCESS_KEY" ''BEGIN{seen_ak=0; seen_sk=0} /^AWS_S3_ACCESS_KEY_ID=/{print "AWS_S3_ACCESS_KEY_ID=" ak; seen_ak=1; next} /^AWS_S3_SECRET_ACCESS_KEY=/{print "AWS_S3_SECRET_ACCESS_KEY=" sk; seen_sk=1; next} {print} END{if(!seen_ak) print "AWS_S3_ACCESS_KEY_ID=" ak; if(!seen_sk) print "AWS_S3_SECRET_ACCESS_KEY=" sk}'' /home/sirius/.env > "$$tmp_env" && cat "$$tmp_env" > /home/sirius/.env && rm -f "$$tmp_env" && exec /home/sirius/run.sh',
      ]

  docs:
    image: squidfunk/mkdocs-material
    volumes:
      - .:/docs
    ports:
      - 8001:8000

  schemas:
    image: nginx:latest
    volumes:
      - ./schemas:/usr/share/nginx/html:ro
    ports:
      - 65493:80

volumes:
  pgdata:
  s3data:
