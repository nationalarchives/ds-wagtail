[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "~3.15"
boto3 = "1.43.118"
django = "6.0.8"
django-allauth = "65.19.7"
django-birdbath = "2.0.1"
django-redis = "7.0.0"
django-taggit = "6.1.0"
pillow-heif = "1.8.0"
psycopg2-binary = "2.9.13"
sentry-sdk = "2.71.0"
tna-frontend-jinja = "1.4.0"
tna-utilities = "1.9.0"
wagtail = "8.0.0"
wagtail-factories = "4.5.0"
wagtail-font-awesome-svg = "2.0.0"
wagtailmedia = "0.19.1"
wagtail-headless-preview = "0.9.0"
whitenoise = "6.12.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
responses = "0.26.3"
pytest-django = "4.14.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
